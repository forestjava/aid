version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aid-backend
    volumes:
      - /data/aid:/data
    environment:
      - PORT=3000
      - FS_ROOT_PATH=/data # путь к данным на хосте не берётся из переменной окружения
    networks:
      - proxy
    restart: unless-stopped
    user: "1013:1013"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_COPYRIGHT=${VITE_COPYRIGHT} # авторство устанавливается переменной окружения
    container_name: aid-frontend
    networks:
      - proxy
    restart: unless-stopped

  runner-demo:
    build:
      context: runner/node
      dockerfile: Dockerfile
    container_name: aid-runner-demo
    environment:
      - PORT=3003
      - CALLBACK_BASE_URL=http://aid-backend:3000
    networks:
      - proxy
    restart: unless-stopped

  runner-crud-api-exporter:
    build:
      context: runner/crud-api-exporter
      dockerfile: Dockerfile
    container_name: aid-runner-crud-api-exporter
    environment:
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS}
      - AI_TEMPERATURE=${AI_TEMPERATURE}
    networks:
      - proxy
    restart: unless-stopped

  runner-toir-fullstack-exporter:
  build:
    context: runner/toir-fullstack-exporter
    dockerfile: Dockerfile
  container_name: aid-runner-toir-fullstack-exporter
  environment:
      # Runtime config (hardcoded)
      - PORT=3030
      - CALLBACK_BASE_URL=http://aid-backend:3000
      # LLM config (production defaults, hardcoded)
      - AI_API_URL=https://openrouter.ai/api/v1/chat/completions
      - AI_MODEL=moonshotai/kimi-k2.5
      - AI_MAX_TOKENS=4000
      - AI_TEMPERATURE=0.7
      # LLM credentials (from .env, secrets only)
      - AI_API_KEY=${AI_API_KEY}
      # Gitea config (hardcoded infrastructure)
      - GITEA_BASE_URL=https://git.greact.ru
      - GITEA_USERNAME=toir-bot
      - GITEA_TOKEN=${GITEA_TOKEN}
      # Portainer config (hardcoded infrastructure)
      - PORTAINER_BASE_URL=http://194.36.208.86:9000
      - PORTAINER_API_KEY=${PORTAINER_API_KEY}
      - PORTAINER_ENDPOINT_ID=3
      - PORTAINER_EXTERNAL_NETWORK=proxy
      # Nginx Proxy Manager config (hardcoded infrastructure)
      - NPM_BASE_URL=http://194.36.208.86:81
      - NPM_IDENTITY=${NPM_IDENTITY}
      - NPM_SECRET=${NPM_SECRET}
      # Deploy config (hardcoded production defaults)
      - PUBLIC_DOMAIN_SUFFIX=greact.ru
      - CLEANUP_TTL_DAYS=7
      - EXPORTER_MOCK_GENERATOR=false
  networks:
    - proxy
  restart: unless-stopped

networks:
  proxy:
    external: true
