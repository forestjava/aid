services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aid-backend
    volumes:
      - /data/aid:/data
    environment:
      - PORT=3000
      - FS_ROOT_PATH=/data
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - GITEA_TOKEN=${GITEA_TOKEN}
      - GITEA_ORG=${GITEA_ORG:-greact}
      - PORTAINER_URL=${PORTAINER_URL:-http://portainer:9000}
      - PORTAINER_API_KEY=${PORTAINER_API_KEY}
      - PORTAINER_ENDPOINT_ID=${PORTAINER_ENDPOINT_ID:-1}
    networks:
      - proxy
    restart: unless-stopped
    user: "1013:1013"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_COPYRIGHT=${VITE_COPYRIGHT} # авторство устанавливается переменной окружения
    container_name: aid-frontend
    networks:
      - proxy
    restart: unless-stopped

  runner-demo:
    build:
      context: runner/node
      dockerfile: Dockerfile
    container_name: aid-runner-demo
    environment:
      - PORT=3003
      - CALLBACK_BASE_URL=http://aid-backend:3000
    networks:
      - proxy
    restart: unless-stopped

  runner-crud-api-exporter:
    build:
      context: runner/crud-api-exporter
      dockerfile: Dockerfile
    container_name: aid-runner-crud-api-exporter
    environment:
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS}
      - AI_TEMPERATURE=${AI_TEMPERATURE}
    networks:
      - proxy
    restart: unless-stopped

  runner-prisma:
    build:
      context: ./runner/runner-prisma
      dockerfile: Dockerfile
    container_name: aid-runner-prisma
    restart: unless-stopped
    environment:
      - CALLBACK_BASE_URL=http://aid-backend:3000
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-16000}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - CONTEXT7_ENABLED=true
      - PORT=3004
    networks:
      - proxy

  runner-nestjs:
    build:
      context: ./runner/runner-nestjs
      dockerfile: Dockerfile
    container_name: aid-runner-nestjs
    restart: unless-stopped
    environment:
      - CALLBACK_BASE_URL=http://aid-backend:3000
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-32000}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - CONTEXT7_ENABLED=true
      - PORT=3005
    networks:
      - proxy

  runner-react-admin:
    build:
      context: ./runner/runner-react-admin
      dockerfile: Dockerfile
    container_name: aid-runner-react-admin
    restart: unless-stopped
    environment:
      - CALLBACK_BASE_URL=http://aid-backend:3000
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-32000}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - CONTEXT7_ENABLED=true
      - PORT=3006
    networks:
      - proxy

networks:
  proxy:
    external: true
