version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aid-backend
    volumes:
      - /data/aid:/data
    environment:
      - PORT=3000
      - FS_ROOT_PATH=/data # путь к данным на хосте не берётся из переменной окружения
    networks:
      - proxy
    restart: unless-stopped
    user: "1013:1013"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_COPYRIGHT=${VITE_COPYRIGHT} # авторство устанавливается переменной окружения
    container_name: aid-frontend
    networks:
      - proxy
    restart: unless-stopped

  runner-demo:
    build:
      context: runner/node
      dockerfile: Dockerfile
    container_name: aid-runner-demo
    environment:
      - PORT=3003
      - CALLBACK_BASE_URL=http://aid-backend:3000
    networks:
      - proxy
    restart: unless-stopped

  runner-crud-api-exporter:
    build:
      context: runner/crud-api-exporter
      dockerfile: Dockerfile
    container_name: aid-runner-crud-api-exporter
    environment:
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS}
      - AI_TEMPERATURE=${AI_TEMPERATURE}
    networks:
      - proxy
    restart: unless-stopped

  runner-toir-fullstack-exporter:
  build:
    context: runner/toir-fullstack-exporter
    dockerfile: Dockerfile
  container_name: aid-runner-toir-fullstack-exporter
  environment:
    - PORT=3030
    - CALLBACK_BASE_URL=http://aid-backend:3000
    # OpenRouter / LLM
    - AI_API_URL=${AI_API_URL}
    - AI_API_KEY=${AI_API_KEY}
    - AI_MODEL=${AI_MODEL}
    - AI_MAX_TOKENS=${AI_MAX_TOKENS}
    - AI_TEMPERATURE=${AI_TEMPERATURE}
    # Gitea
    - GITEA_BASE_URL=${GITEA_BASE_URL}
    - GITEA_USERNAME=${GITEA_USERNAME}
    - GITEA_TOKEN=${GITEA_TOKEN}
    # Portainer
    - PORTAINER_BASE_URL=${PORTAINER_BASE_URL}
    - PORTAINER_API_KEY=${PORTAINER_API_KEY}
    - PORTAINER_ENDPOINT_ID=${PORTAINER_ENDPOINT_ID}
    # Nginx Proxy Manager
    - NPM_BASE_URL=${NPM_BASE_URL}
    - NPM_IDENTITY=${NPM_IDENTITY}
    - NPM_SECRET=${NPM_SECRET}
    # Deploy config
    - PUBLIC_DOMAIN_SUFFIX=${PUBLIC_DOMAIN_SUFFIX}
    - CLEANUP_TTL_DAYS=${CLEANUP_TTL_DAYS}
  networks:
    - proxy
  restart: unless-stopped

networks:
  proxy:
    external: true
