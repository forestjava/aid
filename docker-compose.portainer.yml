version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aid-backend
    volumes:
      - /data/aid:/data
    environment:
      - PORT=3000
      - FS_ROOT_PATH=/data # путь к данным на хосте не берётся из переменной окружения
    networks:
      - proxy
    restart: unless-stopped
    user: "1013:1013"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_COPYRIGHT=${VITE_COPYRIGHT} # авторство устанавливается переменной окружения
    container_name: aid-frontend
    networks:
      - proxy
    restart: unless-stopped

  runner-demo:
    build:
      context: runner/node
      dockerfile: Dockerfile
    container_name: aid-runner-demo
    environment:
      - PORT=3003
      - CALLBACK_BASE_URL=http://aid-backend:3000
    networks:
      - proxy
    restart: unless-stopped

  runner-crud-api-exporter:
    build:
      context: runner/crud-api-exporter
      dockerfile: Dockerfile
    container_name: aid-runner-crud-api-exporter
    environment:
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS}
      - AI_TEMPERATURE=${AI_TEMPERATURE}
    networks:
      - proxy
    restart: unless-stopped

  runner-prisma:
    build:
      context: ./runner/runner-prisma
      dockerfile: Dockerfile
    container_name: aid-runner-prisma
    restart: unless-stopped
    environment:
      CALLBACK_BASE_URL: http://aid-backend:3000
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-16000}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      CONTEXT7_ENABLED: "true"
      PORT: "3004"
    networks:
      - proxy

networks:
  proxy:
    external: true
