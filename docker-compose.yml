
services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aid-backend
    environment:
      - FS_ROOT_PATH=/data
    volumes:
      - ./data:/data
    networks:
      - proxy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: aid-frontend
    env_file:
      - client/.env    
    networks:
      - proxy
    restart: unless-stopped

  proxy:
    image: nginx:latest
    container_name: aid-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - proxy
    restart: unless-stopped

  runner-crud-api-exporter:
    build:
      context: runner/crud-api-exporter
      dockerfile: Dockerfile
    container_name: aid-runner-crud-api-exporter
    env_file:
      - runner/crud-api-exporter/.env
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
